name: Build Switch NRO

# Letakkan file ini di .github/workflows/build-switch.yml pada fork Anda.
# Langkah-langkahnya meniru build-switch-docker.sh (tanpa PVZ_DEBUG).
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-switch:
    name: Build for Switch
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Switch libraries
        shell: bash
        run: |
          source $DEVKITPRO/switchvars.sh
          dkp-pacman -S --needed --noconfirm switch-sdl2 switch-libogg switch-libvorbis switch-mpg123 switch-libpng switch-libjpeg-turbo switch-zlib switch-cmake

      - name: Build libopenmpt for Switch
        shell: bash
        run: |
          source $DEVKITPRO/switchvars.sh
          git clone --depth 1 https://github.com/OpenMPT/openmpt /tmp/openmpt
          cd /tmp/openmpt
          make -j$(nproc) CONFIG=gcc SHARED_LIB=0 DYNLINK=0 EXAMPLES=0 OPENMPT123=0 TEST=0 PREFIX=$PORTLIBS_PREFIX CC=aarch64-none-elf-gcc CXX=aarch64-none-elf-g++ install

      - name: Build PvZ-Portable
        shell: bash
        run: |
          source $DEVKITPRO/switchvars.sh
          cmake -B build-switch -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake
          cmake --build build-switch -j$(nproc)
          ls -la build-switch/pvz-portable.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: pvz-portable-switch
          path: build-switch/pvz-portable.nro
